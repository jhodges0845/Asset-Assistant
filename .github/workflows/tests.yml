name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests:
    name: Core tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e .

      - name: Install coverage tooling
        if: matrix.python-version == '3.12'
        run: python -m pip install coverage

      - name: Run core tests
        if: matrix.python-version != '3.12'
        run: python -m unittest discover -s tests/core -v

      - name: Run core tests with coverage
        if: matrix.python-version == '3.12'
        run: |
          python -m coverage run --source=object_core -m unittest discover -s tests/core -v
          python -m coverage report --show-missing --fail-under=90

  blender-tests:
    name: Blender integration tests (${{ matrix.version }})
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: '5.2.1'
            release: Blender5.2
            directory: blender-5.2.1-linux-x64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Blender runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libgl1 libxi6 libxrender1 libxxf86vm1 libxfixes3 libxkbcommon0

      - name: Restore Blender runtime cache
        id: blender-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/asset-assistant/blender/${{ matrix.directory }}
          key: blender-runtime-${{ runner.os }}-${{ matrix.version }}-${{ matrix.directory }}

      - name: Download, verify, and extract Blender
        if: steps.blender-cache.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        run: |
          base_url=https://mirror.blender.org/release/${{ matrix.release }}
          archive=${{ matrix.directory }}.tar.xz
          cache_root="$HOME/.cache/asset-assistant/blender"
          mkdir -p "$cache_root"
          curl --fail --location --retry 3 --output "$archive" "$base_url/$archive"
          curl --fail --location --retry 3 --output blender.sha256 "$base_url/blender-${{ matrix.version }}.sha256"
          grep " $archive\$" blender.sha256 > selected.sha256
          sha256sum --check selected.sha256
          tar -xf "$archive" -C "$cache_root"
          test -x "$cache_root/${{ matrix.directory }}/blender"

      - name: Run Blender integration tests
        run: |
          "$HOME/.cache/asset-assistant/blender/${{ matrix.directory }}/blender" \
            --background --factory-startup --python-exit-code 1 \
            --python scripts/test_blender.py

      - name: Test real component save/reopen
        run: |
          "$HOME/.cache/asset-assistant/blender/${{ matrix.directory }}/blender" \
            --background --factory-startup --python-exit-code 1 \
            --python scripts/test_component_reopen.py

      - name: Build Asset Assistant release ZIP
        run: python -m scripts.build_blender_addon

      - name: Test isolated Asset Assistant release ZIP
        run: |
          "$HOME/.cache/asset-assistant/blender/${{ matrix.directory }}/blender" \
            --background --factory-startup --python-exit-code 1 \
            --python scripts/test_blender_package.py
